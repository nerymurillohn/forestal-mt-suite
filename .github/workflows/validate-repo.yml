name: Validate Repository Consistency

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Regenerate product data
        run: python tools/build_product_data.py

      - name: Verify assets
        run: python tools/verify_product_assets.py

      - name: Refresh repository inventory
        run: python tools/generate_inventory.py

      - name: Check for unexpected changes
        run: |
          # Allow timestamp-only changes in autogenerated files
          git diff --name-only | grep -v -E '(INVENTORY\.md|README\.md|REPOSITORY_INFO\.md)' > /tmp/unexpected_changes.txt || true
          if [ -s /tmp/unexpected_changes.txt ]; then
            echo "Unexpected file changes detected:"
            cat /tmp/unexpected_changes.txt
            git diff
            exit 1
          fi
          echo "✓ Only expected timestamp updates in autogenerated files"
