name: Validate Repository Consistency

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Regenerate product data
        run: python tools/build_product_data.py

      - name: Verify assets
        run: python tools/verify_product_assets.py

      - name: Refresh repository inventory
        run: python tools/generate_inventory.py

      - name: Ensure working tree clean
        run: git diff --exit-code -- .
