name: Validate Repository Consistency

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate product data
        run: |
          echo "Building product data from Excel..."
          python tools/build_product_data.py

      - name: Verify assets
        run: |
          echo "Verifying product assets..."
          python tools/verify_product_assets.py

      - name: Refresh repository inventory
        run: |
          echo "Generating repository inventory..."
          python tools/generate_inventory.py

      - name: Check for autogenerated file changes
        id: check_changes
        run: |
          # Check if autogenerated files were modified
          git diff --name-only | grep -E '(INVENTORY\.md|README\.md|REPOSITORY_INFO\.md|catalogue\.json)' > /tmp/autogen_changes.txt || true

          if [ -s /tmp/autogen_changes.txt ]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            echo "Autogenerated files modified:"
            cat /tmp/autogen_changes.txt
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "No autogenerated file changes detected"
          fi

      - name: Commit autogenerated files
        if: steps.check_changes.outputs.changes_detected == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Stage only autogenerated files
          git add INVENTORY.md README.md REPOSITORY_INFO.md products-data/catalogue.json

          git commit -m "chore: auto-update autogenerated files [skip ci]" || echo "No changes to commit"

      - name: Push changes
        if: steps.check_changes.outputs.changes_detected == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git push origin main

      - name: Check for unexpected changes
        run: |
          # After automation scripts, verify no unexpected files changed
          git diff --name-only | grep -v -E '(INVENTORY\.md|README\.md|REPOSITORY_INFO\.md|catalogue\.json)' > /tmp/unexpected_changes.txt || true

          if [ -s /tmp/unexpected_changes.txt ]; then
            echo "❌ ERROR: Unexpected file changes detected:"
            cat /tmp/unexpected_changes.txt
            echo ""
            echo "These files should not be modified by automation scripts."
            echo "Either:"
            echo "  1. These changes should be committed manually, or"
            echo "  2. The automation scripts have a bug"
            git diff
            exit 1
          fi

          echo "✓ Only expected timestamp updates in autogenerated files"
